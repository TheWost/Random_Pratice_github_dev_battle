<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battle History</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <nav>
    <a href="/">Arena</a>
    <a href="/history">History</a>
  </nav>

  <h1>Past Battles</h1>

  <form action="/clear" method="post">
    <button type="submit">Clear History</button>
  </form>

    {% for battle in battles %}
    <div class="card">
      <strong>{{ battle["winner"]["username"] }}</strong> defeated <strong>{{ battle["loser"]["username"] }}</strong>
      ({{ battle["winner"]["score"] }} vs {{ battle["loser"]["score"] }})
    </div>
    {% else %}
    <div class="card">
      <strong>No battles yet</strong>
    </div>
    {% endfor %}
</body>
</html>
